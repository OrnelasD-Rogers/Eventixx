version: '3.8'

services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: event-catalog-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - event-catalog-network

  event-catalog-db:
    image: postgres:16-alpine
    container_name: event-catalog-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: eventixx
      POSTGRES_USER: eventixx
      POSTGRES_PASSWORD: eventixx
    volumes:
      - event-catalog-db-data:/var/lib/postgresql/data
    networks:
      - event-catalog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventixx -d eventixx"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  event-catalog-network:
    driver: bridge

volumes:
  event-catalog-db-data:
