# TEMPLATE — Replace __PLACEHOLDERS__ before use
spring.application.name: __SERVICE_NAME__
server.port: __HTTP_PORT__

# __IF_EUREKA__
eureka.client.service-url.defaultZone: http://eureka-server:8761/eureka/
# __END_IF__

# __IF_KAFKA__
spring.kafka.bootstrap-servers: kafka:9092
spring.kafka.consumer.group-id: __CONSUMER_GROUP__
spring.kafka.consumer.key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages: "*"
# __END_IF__

# __IF_POSTGRESQL__
spring.datasource.url: jdbc:postgresql://__DB_SERVICE_NAME__:__DB_PORT__/eventixx
spring.datasource.username: eventixx
spring.datasource.password: eventixx
spring.jpa.hibernate.ddl-auto: validate
spring.flyway.enabled: true
spring.flyway.locations: classpath:db/migration
# __END_IF__

# __IF_ELASTICSEARCH__
spring.elasticsearch.uris: http://elasticsearch:9200
# __END_IF__

management.endpoints.web.exposure.include: health,info
