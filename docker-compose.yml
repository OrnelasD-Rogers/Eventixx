version: '3.8'

services:
  # Kafka (KRaft mode - no Zookeeper)
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - eventixx-network

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.8
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    networks:
      - eventixx-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - eventixx-network

  # PostgreSQL Instances (Database Per Service)
  # TODO: eureka-server service to be added when implemented

  user-db:
    image: postgres:16-alpine
    container_name: user-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: eventixx
      POSTGRES_USER: eventixx
      POSTGRES_PASSWORD: eventixx
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - eventixx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventixx -d eventixx"]
      interval: 5s
      timeout: 5s
      retries: 5

  event-catalog-db:
    image: postgres:16-alpine
    container_name: event-catalog-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: eventixx
      POSTGRES_USER: eventixx
      POSTGRES_PASSWORD: eventixx
    volumes:
      - event-catalog-db-data:/var/lib/postgresql/data
    networks:
      - eventixx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventixx -d eventixx"]
      interval: 5s
      timeout: 5s
      retries: 5

  reservation-db:
    image: postgres:16-alpine
    container_name: reservation-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: eventixx
      POSTGRES_USER: eventixx
      POSTGRES_PASSWORD: eventixx
